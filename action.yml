name: Seetrex Compliance
description: Records every push to the default branch of a private repository against the Cyber Resilience Act catalogue, in Seetrex.
author: Seetrex

inputs:
  dry-run:
    description: Scan and describe what would be sent (files, sizes, sha256), without requesting a token or sending anything.
    required: false
    default: 'false'
  summary:
    description: "What the job summary shows after a successful push: full (the status of each obligation and, for the current ones, their outcome) or counters (only how many obligations are in each status)."
    required: false
    default: full
  strict:
    description: Fail the job when Seetrex is unavailable, rate limits the run or the quota is reached (by default these only warn).
    required: false
    default: 'false'
  request-repin:
    description: Ask Seetrex to register the current default branch for this repository (after renaming it). Sends no documents.
    required: false
    default: 'false'
  request-close:
    description: Ask Seetrex to close the record of this repository. Sends no documents.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # The cache key changes once a day (UTC): one saved database per day, and
    # restore-keys picks up the latest one of an earlier day.
    - name: Date of the Trivy database cache
      id: seetrex-day
      shell: bash
      run: date -u +day=%Y-%m-%d >> "$GITHUB_OUTPUT"

    - name: Cache the Trivy vulnerability database
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ${{ runner.temp }}/seetrex-trivy-cache
        key: seetrex-trivy-db-${{ runner.os }}-${{ runner.arch }}-${{ steps.seetrex-day.outputs.day }}
        restore-keys: |
          seetrex-trivy-db-${{ runner.os }}-${{ runner.arch }}-

    - name: Seetrex Compliance
      id: seetrex
      shell: bash
      env:
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_SUMMARY: ${{ inputs.summary }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_REQUEST_REPIN: ${{ inputs.request-repin }}
        INPUT_REQUEST_CLOSE: ${{ inputs.request-close }}
      # BASH_ENV is dropped so that no file it names runs (or turns on
      # tracing) inside the step; run.sh also turns tracing off first.
      run: env -u BASH_ENV bash "$GITHUB_ACTION_PATH/bin/run.sh"

    - name: Upload the Seetrex record
      if: always() && steps.seetrex.outputs.record != ''
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: seetrex-record
        path: ${{ steps.seetrex.outputs.record }}
        if-no-files-found: error

    - name: Remove the Seetrex output and work directories
      if: always()
      shell: bash
      run: rm -rf -- "$RUNNER_TEMP/seetrex-out" "$RUNNER_TEMP"/seetrex-work.*
